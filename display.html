<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Signal Light — Toastmasters Pulse Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.7.0/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    #light { position: fixed; inset: 0; background: #ffffff;
      transition: background .25s ease; display: flex; align-items: center;
      justify-content: center; flex-direction: column; }
    /* Join screen */
    #join { position: fixed; inset: 0; background: linear-gradient(#e9f2ff, #ffffff);
      display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 28px 24px; width: 88%;
      max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.15); text-align: center; }
    .card h1 { font-size: 20px; margin: 0 0 6px; color: #1e3a8a; }
    .card p { font-size: 13px; color: #475569; margin: 0 0 18px; }
    .card input { width: 100%; font-size: 32px; text-align: center; letter-spacing: 8px;
      padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 16px; }
    .card button { width: 100%; font-size: 18px; font-weight: 700; padding: 14px;
      border: none; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
    /* Big centred banner shown until the first colour arrives */
    #banner { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; text-align: center; z-index: 4;
      pointer-events: none; padding: 24px; }
    #banner .big { font-size: 22px; font-weight: 800; color: #0f172a; }
    #banner .small { font-size: 14px; color: #334155; margin-top: 8px; max-width: 320px; }
    /* Status pill */
    #status { position: fixed; top: 10px; right: 12px; font-size: 12px; padding: 4px 10px;
      border-radius: 20px; background: rgba(0,0,0,.35); color: #fff; z-index: 5; }
    #exit { position: fixed; top: 8px; left: 12px; font-size: 12px; padding: 6px 12px;
      border-radius: 20px; background: rgba(0,0,0,.35); color: #fff; z-index: 5;
      border: none; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Join screen -->
  <div id="join">
    <div class="card">
      <h1>Signal Light</h1>
      <p>Enter the pairing code shown on the timer's computer.</p>
      <input id="code_in" type="tel" inputmode="numeric" maxlength="6" placeholder="0000" />
      <button id="join_btn">Start Light</button>
    </div>
  </div>

  <!-- Full-screen light -->
  <div id="light" class="hidden">
    <button id="exit" class="hidden">Change code</button>
    <div id="status">connecting…</div>
    <div id="banner">
      <div class="big" id="banner_big">Connecting…</div>
      <div class="small" id="banner_small"></div>
    </div>
  </div>

  <script>
    // Must match the broker used by the timer page (index.html).
    const RT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
    const $ = (id) => document.getElementById(id);
    let client = null, wakeLock = null, gotColor = false, curRoom = '';

    function topicFor(room) { return 'tmpulse/light/' + room; }

    async function requestWakeLock() {
      try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }
      catch (e) { /* ignore */ }
    }
    document.addEventListener('visibilitychange', () => {
      if (wakeLock === null && document.visibilityState === 'visible') requestWakeLock();
    });

    function setStatus(txt) { $('status').textContent = txt; }
    function setBanner(big, small) {
      $('banner_big').textContent = big;
      $('banner_small').textContent = small || '';
    }

    function connect(room) {
      curRoom = room;
      gotColor = false;
      $('join').classList.add('hidden');
      $('light').classList.remove('hidden');
      $('exit').classList.remove('hidden');
      $('banner').classList.remove('hidden');
      $('light').style.background = '#ffffff';
      requestWakeLock();
      const clientId = 'disp_' + Math.random().toString(16).slice(2);
      setStatus('connecting…');
      setBanner('Connecting…', 'Reaching the sync server for code ' + room);
      try {
        client = mqtt.connect(RT_BROKER, {
          clientId, connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 30, clean: true
        });
      } catch (e) {
        setStatus('error'); setBanner('Cannot start', String(e));
        return;
      }
      const topic = topicFor(room);
      client.on('connect', () => {
        setStatus('online');
        if (!gotColor) setBanner('Connected \u2713', 'Waiting for the timer (code ' + room + ')\u2026 Make sure the computer is logged in and showing the same code.');
        client.subscribe(topic, (err) => {
          if (err) setBanner('Subscribe failed', String(err));
        });
      });
      client.on('reconnect', () => setStatus('reconnecting…'));
      client.on('close', () => { setStatus('offline'); if (!gotColor) setBanner('Offline', 'Cannot reach the sync server. Check this phone\u2019s internet, or try Wi-Fi instead of cellular.'); });
      client.on('offline', () => setStatus('offline'));
      client.on('error', (e) => { setStatus('error'); if (!gotColor) setBanner('Connection error', String(e && e.message ? e.message : e)); });
      client.on('message', (t, payload) => {
        const color = payload.toString();
        if (/^#[0-9a-fA-F]{3,8}$/.test(color)) {
          gotColor = true;
          $('banner').classList.add('hidden');
          $('light').style.background = color;
        }
      });
    }

    function disconnect() {
      try { if (client) client.end(true); } catch (e) {}
      client = null;
      $('light').classList.add('hidden');
      $('join').classList.remove('hidden');
    }

    $('join_btn').addEventListener('click', () => {
      const code = ($('code_in').value || '').trim();
      if (!code) { $('code_in').focus(); return; }
      connect(code);
    });
    $('code_in').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join_btn').click(); });
    $('exit').addEventListener('click', disconnect);

    // Auto-join if code is passed via ?code=1234 (e.g. from a QR code).
    const params = new URLSearchParams(location.search);
    const preset = params.get('code');
    if (preset) { $('code_in').value = preset; connect(preset); }
  </script>
</body>
</html>
