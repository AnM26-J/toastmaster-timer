<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" id="theme_meta" />
  <title>Signal Light — Toastmasters Pulse Assistant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      background: #ffffff; transition: background .25s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    #light { position: fixed; inset: 0; background: #ffffff;
      transition: background .25s ease; display: flex; align-items: center;
      justify-content: center; flex-direction: column; }
    /* Join screen */
    #join { position: fixed; inset: 0; background: linear-gradient(#e9f2ff, #ffffff);
      display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 28px 24px; width: 88%;
      max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.15); text-align: center; }
    .card h1 { font-size: 20px; margin: 0 0 6px; color: #1e3a8a; }
    .card p { font-size: 13px; color: #475569; margin: 0 0 18px; }
    .card input { width: 100%; font-size: 32px; text-align: center; letter-spacing: 8px;
      padding: 12px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 16px; }
    .card button { width: 100%; font-size: 18px; font-weight: 700; padding: 14px;
      border: none; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; }
    /* Big centred banner shown until the first colour arrives */
    #banner { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; text-align: center; z-index: 4;
      pointer-events: none; padding: 24px; }
    #banner .big { font-size: 22px; font-weight: 800; color: #0f172a; }
    #banner .small { font-size: 14px; color: #334155; margin-top: 8px; max-width: 320px; }
    /* Status pill */
    #status { position: fixed; top: 10px; right: 12px; font-size: 12px; padding: 4px 10px;
      border-radius: 20px; background: rgba(0,0,0,.35); color: #fff; z-index: 5; }
    #top_controls { position: fixed; top: 8px; left: 12px; right: 90px; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 8px; }
    #exit, #fullscreen_btn { font-size: 12px; padding: 6px 12px;
      border-radius: 20px; background: rgba(0,0,0,.35); color: #fff;
      border: none; cursor: pointer; }
    #wake_hint { font-size: 12px; color: #64748b; margin-top: 10px; max-width: 300px; }
    #fs_tip { position: fixed; left: 12px; right: 12px; bottom: 24px; z-index: 6;
      background: rgba(15,23,42,.94); color: #fff; padding: 16px 18px; border-radius: 14px;
      font-size: 14px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    #fs_tip button { margin-top: 12px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- Join screen -->
  <div id="join">
    <div class="card">
      <h1>Signal Light</h1>
      <p>Enter the pairing code shown on the timer's computer.</p>
      <input id="code_in" type="tel" inputmode="numeric" maxlength="6" placeholder="0000" />
      <button id="join_btn">Start Light</button>
      <div id="wake_hint" style="margin-top:14px;"></div>
    </div>
  </div>

  <!-- Full-screen light -->
  <div id="light" class="hidden">
    <div id="top_controls">
      <button id="exit" class="hidden">Change code</button>
      <button id="fullscreen_btn" class="hidden">⛶ Full screen</button>
    </div>
    <div id="status">connecting…</div>
    <div id="banner">
      <div class="big" id="banner_big">Connecting…</div>
      <div class="small" id="banner_small"></div>
      <div id="wake_hint2"></div>
    </div>
  </div>

  <div id="fs_tip" class="hidden"></div>

  <script>
    // Sync over ntfy.sh via plain HTTPS/WSS (port 443) so it works through
    // restrictive/corporate networks. Must match the timer page (index.html).
    const NTFY_HTTP = 'https://ntfy.sh/';
    const NTFY_WS = 'wss://ntfy.sh/';
    const $ = (id) => document.getElementById(id);
    let ws = null, wakeLock = null, gotColor = false, curRoom = '';
    let active = false, reconnectTimer = null;

    const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    function topicFor(room) { return 'tmpulse-signal-' + room; }
    function validColor(c) { return /^#[0-9a-fA-F]{3,8}$/.test(c); }

    function setWakeHint(msg) {
      const a = $('wake_hint'), b = $('wake_hint2');
      if (a) a.textContent = msg;
      if (b) b.textContent = msg;
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
          setWakeHint('Screen will stay awake while this tab is open.');
          return true;
        }
      } catch (e) { /* fall through to hint below */ }
      if (isIOS && !isStandalone) {
        setWakeHint('Tip: tap Share \u2192 Add to Home Screen, then open it from there \u2014 this keeps the screen awake and hides the browser bar.');
      } else {
        setWakeHint('This browser may still dim the screen after a while \u2014 tap the screen occasionally to keep it awake.');
      }
      return false;
    }
    document.addEventListener('visibilitychange', () => {
      if (wakeLock === null && document.visibilityState === 'visible' && active) requestWakeLock();
    });
    // A user gesture (tap) gives the Wake Lock / Fullscreen APIs the best chance
    // of succeeding, and lets someone retry manually if the silent auto-attempt failed.
    $('light').addEventListener('click', () => { if (active && wakeLock === null) requestWakeLock(); });

    function fsApiSupported() {
      const el = document.documentElement;
      return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
    }

    function showFsTip(html) {
      const tip = $('fs_tip');
      tip.innerHTML = html + '<br><button id="fs_tip_close">Got it</button>';
      tip.classList.remove('hidden');
      $('fs_tip_close').addEventListener('click', () => tip.classList.add('hidden'));
    }

    function goFullscreen() {
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) {
        req.call(el).catch(() => {});
      } else {
        showFsTip('iPhone\u2019s Safari doesn\u2019t allow web pages to go truly full screen \u2014 that\u2019s an Apple restriction, not a bug.<br><br>Closest option: tap the <b>Share</b> button below, choose <b>\u201cAdd to Home Screen\u201d</b>, then open Signal Light from your Home Screen icon \u2014 it opens without the address bar.');
      }
    }
    function setupFullscreenButton() {
      const btn = $('fullscreen_btn');
      if (isStandalone) { btn.classList.add('hidden'); return; }
      if (!fsApiSupported()) { btn.textContent = '\u{1F4F2} Add to Home Screen'; }
    }
    setupFullscreenButton();
    $('fullscreen_btn').addEventListener('click', goFullscreen);

    function setStatus(txt) { $('status').textContent = txt; }
    function setBanner(big, small) {
      $('banner_big').textContent = big;
      $('banner_small').textContent = small || '';
    }
    function applyColor(color) {
      if (!validColor(color)) return;
      gotColor = true;
      $('banner').classList.add('hidden');
      $('light').style.background = color;
      document.documentElement.style.background = color;
      document.body.style.background = color;
      const meta = $('theme_meta');
      if (meta) meta.setAttribute('content', color);
    }

    // Fetch the last cached colour so a phone joining mid-session syncs at once.
    function pollLast(room) {
      fetch(NTFY_HTTP + topicFor(room) + '/json?poll=1&since=12h')
        .then((r) => r.text())
        .then((txt) => {
          const lines = txt.trim().split('\n').filter(Boolean);
          for (let i = lines.length - 1; i >= 0; i--) {
            try {
              const d = JSON.parse(lines[i]);
              if (d.event === 'message' && validColor(d.message)) { applyColor(d.message); break; }
            } catch (e) { /* skip */ }
          }
        })
        .catch(() => {});
    }

    function openSocket(room) {
      if (!active) return;
      let sock;
      try { sock = new WebSocket(NTFY_WS + topicFor(room) + '/ws'); }
      catch (e) { setStatus('error'); scheduleReconnect(room); return; }
      ws = sock;
      sock.onopen = () => {
        setStatus('online');
        if (!gotColor) setBanner('Connected \u2713', 'Waiting for the timer (code ' + room + ')\u2026 Make sure the computer is logged in and showing the same code.');
      };
      sock.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d.event === 'message' && validColor(d.message)) applyColor(d.message);
        } catch (err) { /* ignore */ }
      };
      sock.onclose = () => {
        setStatus('offline');
        if (!gotColor) setBanner('Reconnecting\u2026', 'Trying to reach the sync server. If this stays, switch this phone between Wi-Fi and cellular.');
        scheduleReconnect(room);
      };
      sock.onerror = () => { setStatus('error'); try { sock.close(); } catch (e) {} };
    }

    function scheduleReconnect(room) {
      if (!active) return;
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => { if (active) openSocket(room); }, 3000);
    }

    function connect(room) {
      curRoom = room;
      gotColor = false;
      active = true;
      $('join').classList.add('hidden');
      $('light').classList.remove('hidden');
      $('exit').classList.remove('hidden');
      if (!isStandalone) $('fullscreen_btn').classList.remove('hidden');
      $('banner').classList.remove('hidden');
      $('light').style.background = '#ffffff';
      document.documentElement.style.background = '#ffffff';
      document.body.style.background = '#ffffff';
      requestWakeLock();
      setStatus('connecting…');
      setBanner('Connecting…', 'Reaching the sync server for code ' + room);
      pollLast(room);
      openSocket(room);
    }

    function disconnect() {
      active = false;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      try { if (ws) ws.close(); } catch (e) {}
      ws = null;
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      document.documentElement.style.background = '';
      document.body.style.background = '';
      $('light').classList.add('hidden');
      $('join').classList.remove('hidden');
    }

    $('join_btn').addEventListener('click', () => {
      const code = ($('code_in').value || '').trim();
      if (!code) { $('code_in').focus(); return; }
      connect(code);
    });
    $('code_in').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join_btn').click(); });
    $('exit').addEventListener('click', disconnect);

    // Auto-join if code is passed via ?code=1234 (e.g. from a QR code).
    const params = new URLSearchParams(location.search);
    const preset = params.get('code');
    if (preset) { $('code_in').value = preset; connect(preset); }
  </script>
</body>
</html>
